<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GHOST PROTOCOL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    cursor: crosshair;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #cabinet {
    position: relative;
    line-height: 0;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 120px 10px rgba(30, 40, 120, 0.25) inset;
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
</style>
</head>
<body>
  <div id="cabinet"><canvas id="screen"></canvas></div>
  <script>
    // Served over http, browsers hang onto a stale game.js even with no-store,
    // so ask for a unique URL. Opened straight off disk, load it plainly --
    // file:// URLs and query strings do not mix.
    (function () {
      var http = location.protocol === 'http:' || location.protocol === 'https:';
      var s = document.createElement('script');
      s.src = 'game.js' + (http ? '?t=' + Date.now() : '');
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
