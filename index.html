<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GHOST PROTOCOL</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #07080c;
    height: 100%;
    overflow: hidden;
    cursor: crosshair;
    /* On a phone each of these is a way to lose the gesture: the page
       zooming under a pinch, the board scrolling under a drawn path, a
       double tap zooming instead of freezing, the browser offering to
       select text or preview a "link" on a long press. The cabinet is the
       whole document, so the whole document opts out. */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 100dvh;   /* the URL bar comes and goes; 100% does not notice */
  }
  /* The room the cabinet stands in. When time stops it takes the light of
     the ghost you are talking to -- amber instead while one is overdue and
     the game refuses to run. The game only sets classes on body and the
     ghost's color in --accent (see syncShell in game.js); every look lives
     here. Nothing below may transform, filter or resize #cabinet or
     #screen: the board is an integer-scaled raster and the hit-testing
     reads its rect, so the room changes color and never geometry. */
  @property --lit {
    syntax: '<color>';
    inherits: true;
    initial-value: #5878ff;
  }
  body {
    --accent: #5878ff;
    --lit: var(--accent);
    transition: --lit 200ms ease-out;
  }
  body.blocked { --lit: #ffb040; }
  /* The light is a wrapper's, not the cabinet's. #cabinet clips its own
     children, so a glow on one of its pseudo-elements would be cut off at
     the bezel -- and a positioned pseudo-element would paint over the
     canvas and tint the board. isolation keeps the light behind the
     cabinet but in front of the page. */
  #stage {
    position: relative;
    isolation: isolate;
  }
  #stage::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: 14px;
    box-shadow: 0 0 140px 36px var(--lit);
    opacity: 0;
    transition: opacity 90ms ease-in;
  }
  body.frozen #stage::before {
    opacity: 0.3;
    transition: opacity 160ms ease-out;
  }
  #cabinet {
    position: relative;
    line-height: 0;
    border-radius: 14px;
    overflow: hidden;
    /* three layers in every state, so the change is a transition and not
       a swap: instrument ring, outer glow, the glass's own inner shade */
    box-shadow:
      0 0 0 0 transparent,
      0 0 90px 8px rgba(33, 48, 240, 0.18),
      0 0 8px 2px rgba(0, 0, 0, 0.9) inset;
    transition: box-shadow 90ms ease-in;
  }
  body.frozen #cabinet {
    box-shadow:
      0 0 0 1px var(--lit),
      0 0 90px 8px rgba(33, 48, 240, 0.18),
      0 0 8px 2px rgba(0, 0, 0, 0.9) inset;
    transition: box-shadow 160ms ease-out;
  }
  @supports (color: color-mix(in srgb, red 50%, transparent)) {
    body.frozen #cabinet {
      box-shadow:
        0 0 0 1px var(--lit),
        0 0 36px 3px color-mix(in srgb, var(--lit) 40%, transparent),
        0 0 8px 2px rgba(0, 0, 0, 0.9) inset;
    }
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  /* Two lines share one slot. The resting one (the first-visit pointer)
     sets the slot's size, and the live instruction is laid over it rather
     than beside it, so swapping them can never change the hint's height
     and nudge the cabinet under a finger that is mid-drag. */
  #hint {
    position: relative;
    font: 11px/1.6 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.08em;
    color: #8fa0c0;
    user-select: none;
    max-width: 90vw;
    text-align: center;
    text-wrap: balance;
  }
  #hint b { color: #f0c897; font-weight: 600; }
  #hint-idle { transition: opacity 90ms ease-in; }
  #hint-live {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;   /* overflows both ways, so it stays centred */
    white-space: nowrap;
    font: 600 13px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    letter-spacing: 0.06em;
    color: #e8edff;
    opacity: 0;
    transition: opacity 90ms ease-in;
  }
  body.frozen #hint-idle { opacity: 0; transition: opacity 160ms ease-out; }
  body.frozen #hint-live { opacity: 1; transition: opacity 160ms ease-out; }
  body.blocked #hint-live { color: #ffb040; }
  /* The practice keeps its coach's sentence up in live play as well as
     frozen. It is a sentence, in sentence case, so it is set a size up
     and untracked, as prose is. Its lines run longer than the game's, so
     they may wrap -- two balanced lines hung from the top of the slot the
     resting line already holds open, so a second line spills down into
     the page and never up onto the glass, and the slot never changes
     size under a finger. */
  body.coaching #hint-idle { opacity: 0; transition: opacity 160ms ease-out; }
  body.coaching #hint-live {
    opacity: 1;
    transition: opacity 160ms ease-out;
    align-items: flex-start;
    white-space: normal;
    font-size: 15px;
    letter-spacing: 0;
    line-height: 1.25;
    text-align: center;
    text-wrap: balance;
  }
  /* narrow glass: the hint wraps to two lines rather than running off it */
  @media (max-width: 520px) {
    #hint { font-size: 10px; letter-spacing: 0.05em; }
    #hint-live { font-size: 12px; letter-spacing: 0.03em; }
  }
  /* Everything still changes state; nothing travels to get there. */
  @media (prefers-reduced-motion: reduce) {
    body, #stage::before, #cabinet, #hint-idle, #hint-live,
    body.frozen #stage::before, body.frozen #cabinet,
    body.frozen #hint-idle, body.frozen #hint-live,
    body.coaching #hint-idle, body.coaching #hint-live { transition: none; }
  }
</style>
</head>
<body>
  <div id="stage"><div id="cabinet"><canvas id="screen"></canvas></div></div>
  <div id="hint"><span id="hint-idle">NEW HERE? CLICK THE <b>?</b> CHIP, TOP RIGHT &nbsp;&middot;&nbsp; THE CLICK IS THE CLOCK</span><span id="hint-live"></span></div>
  <script>
    /* The shell speaks the same idiom the game does. A phone player has no
       click to give, and the ? chip is the one control worth pointing at
       before they have touched anything. Runs before the engine so the line
       never flickers through the wrong wording.
       A first visit -- nothing remembered, storage that will not answer, or
       ?tutorial in the link -- is told instead what the first press does:
       it starts a short practice, not a round. The returning line is kept
       on the element, and the game puts it back once a practice has run. */
    (function () {
      try {
        var coarse = navigator.maxTouchPoints > 0
          && !(window.matchMedia && window.matchMedia('(pointer: fine)').matches);
        var idle = document.getElementById('hint-idle');
        var back = coarse
          ? 'NEW HERE? TAP THE <b>?</b> CHIP, TOP RIGHT &nbsp;&middot;&nbsp; THE TAP IS THE CLOCK'
          : idle.innerHTML;
        var first;
        try { first = localStorage.getItem('gpOnboard') === null; } catch (e) { first = true; }
        // the parameter itself, as game.js tests it: not any link that says "tutorial"
        if (/[?&]tutorial(=|&|$)/.test(location.search)) first = true;
        if (first) {
          idle.dataset.after = back;
          idle.innerHTML = 'FIRST TIME? <b>' + (coarse ? 'TAP' : 'CLICK')
            + '</b> TO START &nbsp;&middot;&nbsp; A 1-MINUTE PRACTICE COMES FIRST';
        } else if (coarse) {
          idle.innerHTML = back;
        }
      } catch (e) {}
    })();
  </script>
  <script>
    // Served over http, browsers hang onto a stale game.js even with no-store,
    // so ask for a unique URL. Opened straight off disk, load it plainly --
    // file:// URLs and query strings do not mix.
    (function () {
      var http = location.protocol === 'http:' || location.protocol === 'https:';
      var s = document.createElement('script');
      s.src = 'game.js' + (http ? '?t=' + Date.now() : '');
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
